<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Liquid glass gradient for background -->
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a5c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d5a87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a5c;stop-opacity:1" />
    </linearGradient>

    <!-- Glass highlight -->
    <linearGradient id="glassHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>

    <!-- Orange gradient for trim handles -->
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9500;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff6b00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e55a00;stop-opacity:1" />
    </linearGradient>

    <!-- Blue gradient for clip -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5ac8fa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#007aff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0051a8;stop-opacity:1" />
    </linearGradient>

    <!-- Inner shadow filter -->
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dx="4" dy="4" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>

    <!-- Drop shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Glow effect for handles -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square with glass effect -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#glassGradient)" filter="url(#dropShadow)"/>

  <!-- Glass highlight overlay -->
  <rect x="64" y="64" width="896" height="448" rx="200" ry="200" fill="url(#glassHighlight)" clip-path="inset(0 0 50% 0)"/>

  <!-- Video clip/filmstrip representation -->
  <g transform="translate(512, 512)">
    <!-- Main clip body -->
    <rect x="-320" y="-120" width="640" height="240" rx="24" ry="24" fill="url(#blueGradient)" filter="url(#dropShadow)"/>

    <!-- Film sprocket holes - left side -->
    <rect x="-300" y="-100" width="24" height="40" rx="6" fill="#1a3a5c" opacity="0.6"/>
    <rect x="-300" y="-30" width="24" height="40" rx="6" fill="#1a3a5c" opacity="0.6"/>
    <rect x="-300" y="40" width="24" height="40" rx="6" fill="#1a3a5c" opacity="0.6"/>

    <!-- Film sprocket holes - right side -->
    <rect x="276" y="-100" width="24" height="40" rx="6" fill="#1a3a5c" opacity="0.6"/>
    <rect x="276" y="-30" width="24" height="40" rx="6" fill="#1a3a5c" opacity="0.6"/>
    <rect x="276" y="40" width="24" height="40" rx="6" fill="#1a3a5c" opacity="0.6"/>

    <!-- Clip highlight -->
    <rect x="-320" y="-120" width="640" height="120" rx="24" ry="24" fill="url(#glassHighlight)" opacity="0.5"/>

    <!-- Left trim handle -->
    <g filter="url(#glow)">
      <rect x="-360" y="-140" width="60" height="280" rx="12" ry="12" fill="url(#orangeGradient)"/>
      <!-- Handle grip lines -->
      <line x1="-340" y1="-80" x2="-320" y2="-80" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      <line x1="-340" y1="-40" x2="-320" y2="-40" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      <line x1="-340" y1="0" x2="-320" y2="0" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      <line x1="-340" y1="40" x2="-320" y2="40" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      <line x1="-340" y1="80" x2="-320" y2="80" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      <!-- Handle highlight -->
      <rect x="-360" y="-140" width="30" height="280" rx="12" ry="12" fill="url(#glassHighlight)" opacity="0.4"/>
    </g>

    <!-- Right trim handle -->
    <g filter="url(#glow)">
      <rect x="300" y="-140" width="60" height="280" rx="12" ry="12" fill="url(#orangeGradient)"/>
      <!-- Handle grip lines -->
      <line x1="320" y1="-80" x2="340" y2="-80" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      <line x1="320" y1="-40" x2="340" y2="-40" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      <line x1="320" y1="0" x2="340" y2="0" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      <line x1="320" y1="40" x2="340" y2="40" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      <line x1="320" y1="80" x2="340" y2="80" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      <!-- Handle highlight -->
      <rect x="300" y="-140" width="30" height="280" rx="12" ry="12" fill="url(#glassHighlight)" opacity="0.4"/>
    </g>

    <!-- Scissors icon in center -->
    <g transform="translate(0, 0) scale(0.8)" opacity="0.9">
      <path d="M-60,-40 C-80,-60 -80,-80 -60,-80 C-40,-80 -20,-60 0,-40"
            fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
      <path d="M-60,40 C-80,60 -80,80 -60,80 C-40,80 -20,60 0,40"
            fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
      <path d="M0,-40 L60,0 L0,40"
            fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Scissor pivot -->
      <circle cx="0" cy="0" r="12" fill="#ffffff"/>
    </g>
  </g>

  <!-- Subtle border -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.2"/>
</svg>
